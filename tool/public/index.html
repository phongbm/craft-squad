<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="cs-token" content="%%CS_TOKEN%%">
  <title>CraftSquad Studio</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">C</span>
        <span class="brand-name">CraftSquad Studio</span>
      </div>
      <div class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" id="tab-accounts" role="tab" aria-selected="true" aria-controls="view-accounts" type="button">Accounts</button>
        <button class="tab" id="tab-roles" role="tab" aria-selected="false" aria-controls="view-roles" type="button">Squad roles</button>
      </div>
      <div class="topbar-end">
        <span class="conn conn-ok" id="conn">Connected</span>
        <button class="btn btn-quiet btn-icon" id="refresh" type="button" aria-label="Refresh">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4v5h-5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <div id="view-accounts" role="tabpanel" aria-labelledby="tab-accounts"></div>
    <div id="view-roles" role="tabpanel" aria-labelledby="tab-roles" hidden></div>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <noscript><p class="noscript">CraftSquad Studio needs JavaScript.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
